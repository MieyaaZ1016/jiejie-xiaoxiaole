      <stop offset="0" stop-color="#fff8ef"/>
      <stop offset="0.55" stop-color="#ffd8c9"/>
      <stop offset="1" stop-color="#ffb7a7"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <!-- Floating boxes -->
  <g transform="translate(800,160) rotate(-8)">
