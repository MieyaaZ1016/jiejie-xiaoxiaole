<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff8ef"/>
      <stop offset="0.55" stop-color="#ffd8c9"/>
      <stop offset="1" stop-color="#ff8a3d"/>
    </linearGradient>
    <linearGradient id="ribbon" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#ffd36d"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <!-- Box body -->
  <rect x="96" y="170" width="320" height="226" rx="36" fill="#ff8a3d" stroke="#e5661f" stroke-width="6"/>
  <!-- Lid -->
  <rect x="80" y="138" width="352" height="68" rx="28" fill="#ffd8c9" stroke="#e5661f" stroke-width="6"/>
  <!-- Vertical ribbon -->
  <rect x="232" y="138" width="48" height="258" fill="url(#ribbon)"/>
  <!-- Bow -->
  <ellipse cx="220" cy="138" rx="46" ry="30" fill="#ffd36d" stroke="#e5661f" stroke-width="5"/>
  <ellipse cx="292" cy="138" rx="46" ry="30" fill="#ffd36d" stroke="#e5661f" stroke-width="5"/>
  <circle cx="256" cy="138" r="14" fill="#ffd36d" stroke="#e5661f" stroke-width="5"/>
  <!-- Sparkle -->
  <g fill="#fff">
    <circle cx="372" cy="86" r="6"/>
    <circle cx="408" cy="120" r="4"/>
    <circle cx="110" cy="430" r="5"/>
  </g>
</svg>
